<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RUNNING</title>
<link rel="stylesheet" href="../source/NerdTools/usr/local/emhttp/plugins/NerdTools/css/NerdTools.css">
<style>table { font-weight: 700; }</style>
</head>
<body>
<ul class="catalog-status" id="catalog-status"><li><strong>NerdTools version: </strong>2026.11.16.10</li><li><strong>Package release: </strong>packages-test</li><li><strong>Last successful check: </strong>16/11/2026, 09:41:43</li><li><strong>Next eligible check: </strong>17/11/2026, 09:41:43</li></ul>
<table class="tablesorter"><tbody>
<tr data-case="current"><td><select class="pkgaction"><option value="keep">Keep</option><option value="remove">Remove</option></select></td><td class="version-value">1.0</td><td class="version-value">1.0</td><td class="planned-change">No change</td></tr>
<tr class="package-has-update" data-case="available"><td><select class="pkgaction"><option value="keep">Keep</option><option value="upgrade">Upgrade</option><option value="remove">Remove</option></select></td><td class="version-value">1.0</td><td class="version-value">2.0</td><td class="planned-change">Update available</td></tr>
<tr data-case="install"><td><select class="pkgaction"><option value="keep">-</option><option value="install" selected>Install</option></select></td><td class="version-value">—</td><td class="version-value">1.0</td><td class="planned-change">Install</td></tr>
<tr data-case="uninstalled"><td><select class="pkgaction"><option value="keep">-</option><option value="install">Install</option></select></td><td class="version-value">—</td><td class="version-value">5.0.2-2_NT73</td><td class="planned-change">No change</td></tr>
<tr data-case="libyaml"><td><select class="pkgaction"><option value="keep">Keep</option><option value="remove">Remove</option></select></td><td>libyaml</td><td class="planned-change">No change</td></tr>
<tr data-case="ruby"><td><select class="pkgaction"><option value="keep">Keep</option><option value="remove">Remove</option></select></td><td>ruby</td><td class="planned-change">No change</td></tr>
<tr data-case="vim"><td><select class="pkgaction"><option value="keep">Keep</option><option value="remove">Remove</option></select></td><td>vim</td><td class="planned-change">No change</td></tr>
</tbody></table>
<pre id="result"></pre>
<script>
(function () {
    const colors = {
        remove: 'rgba(198, 40, 40, 0.22)',
        install: 'rgba(46, 125, 50, 0.22)',
        upgrade: 'rgba(21, 101, 192, 0.22)',
        available: 'rgba(249, 168, 37, 0.22)'
    };
    const row = name => document.querySelector(`tr[data-case="${name}"]`);
    const select = name => row(name).querySelector('select');
    const background = name => getComputedStyle(row(name).cells[0]).backgroundColor;
    const weight = (name, index) => getComputedStyle(row(name).querySelectorAll('.version-value')[index]).fontWeight;
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    const applyAction = (name, action, hasUpdate = false) => {
        const element = row(name); const changed = action !== 'keep';
        const stateClass = action === 'remove' ? 'package-remove'
            : (action === 'install' ? 'package-install'
            : (['upgrade', 'downgrade'].includes(action) ? 'package-upgrade'
            : (hasUpdate ? 'package-update-available' : '')));
        element.querySelectorAll('td').forEach(cell => {
            cell.classList.remove('package-remove', 'package-install', 'package-upgrade', 'package-update-available');
            if (stateClass) cell.classList.add(stateClass);
        });
        element.querySelector('td').classList.toggle('package-action-changed', changed);
        element.querySelectorAll('.version-value').forEach(cell =>
            cell.classList.toggle('package-version-update', hasUpdate && ['keep', 'upgrade', 'downgrade'].includes(action)));
        element.querySelector('.planned-change').classList.toggle('package-change-selected', changed);
        select(name).value = action;
    };
    try {
        applyAction('current', 'keep');
        applyAction('available', 'keep', true);
        applyAction('install', 'install');
        applyAction('uninstalled', 'keep');
        for (const name of ['libyaml', 'ruby', 'vim']) applyAction(name, 'keep');
        const status = document.getElementById('catalog-status');
        assert(status.children.length === 4, 'Catalog status must contain four compact list items');
        assert([...status.children].every(item => item.tagName === 'LI' && item.querySelector('strong')),
            'Each catalog item must keep its label and value together');
        assert(background('current') !== colors.remove, 'Keep row must not be red');
        assert(weight('current', 0) === '400' && weight('current', 1) === '400', 'Current versions must override inherited bold');
        assert(background('available') === colors.available, 'Available update must be yellow');
        assert(weight('available', 0) === '600' && weight('available', 1) === '600', 'Available versions must be bold');
        assert(row('install').querySelector('td').classList.contains('package-action-changed'), 'Install action cell must be emphasized');
        assert(background('install') === colors.install, 'Install must be green');
        assert(weight('install', 0) === '400' && weight('install', 1) === '400', 'Install versions must remain normal');
        assert(background('uninstalled') !== colors.available, 'Uninstalled Keep must not be yellow');
        assert(weight('uninstalled', 0) === '400' && weight('uninstalled', 1) === '400', 'Uninstalled versions must remain normal');
        applyAction('available', 'upgrade', true);
        assert(background('available') === colors.upgrade, 'Upgrade must override yellow with blue');
        for (const name of ['libyaml', 'ruby', 'vim']) applyAction(name, 'remove');
        for (const name of ['libyaml', 'ruby', 'vim']) assert(background(name) === colors.remove, `${name} Remove must be red`);
        const body = document.querySelector('tbody');
        [...body.rows].reverse().forEach(element => body.appendChild(element));
        for (const name of ['libyaml', 'ruby', 'vim']) assert(background(name) === colors.remove, `${name} Remove must stay red after sorting`);
        assert(row('ruby').querySelector('td').classList.contains('package-action-changed'), 'Ruby Remove action cell must be emphasized');
        applyAction('ruby', 'keep');
        assert(background('ruby') !== colors.remove, 'Ruby Keep must immediately clear red');
        assert(!row('ruby').querySelector('td').classList.contains('package-action-changed'), 'Ruby Keep must clear action-cell emphasis');
        assert(background('libyaml') === colors.remove && background('vim') === colors.remove, 'Other Remove rows must stay red');
        document.title = 'PASS'; document.getElementById('result').textContent = 'PASS';
    } catch (error) {
        document.title = 'FAIL'; document.getElementById('result').textContent = error.stack || String(error);
    }
}());
</script>
</body>
</html>
