<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>RUNNING</title>
<link rel="stylesheet" href="../source/NerdTools/usr/local/emhttp/plugins/NerdTools/css/NerdTools.css">
</head>
<body>
<table class="tablesorter"><tbody>
<tr data-case="current"><td><select class="pkgaction"><option value="keep">Keep</option><option value="remove">Remove</option></select></td><td class="version-value">1.0</td><td class="version-value">1.0</td><td class="planned-change">No change</td></tr>
<tr class="package-has-update" data-case="available"><td><select class="pkgaction"><option value="keep">Keep</option><option value="upgrade">Upgrade</option><option value="remove">Remove</option></select></td><td class="version-value">1.0</td><td class="version-value">2.0</td><td class="planned-change">Update available</td></tr>
<tr data-case="install"><td><select class="pkgaction package-action-selected"><option value="keep">-</option><option value="install" selected>Install</option></select></td><td class="version-value">—</td><td class="version-value">1.0</td><td class="planned-change">Install</td></tr>
<tr data-case="libyaml"><td><select class="pkgaction"><option value="keep">Keep</option><option value="remove">Remove</option></select></td><td>libyaml</td><td class="planned-change">No change</td></tr>
<tr data-case="ruby"><td><select class="pkgaction"><option value="keep">Keep</option><option value="remove">Remove</option></select></td><td>ruby</td><td class="planned-change">No change</td></tr>
<tr data-case="vim"><td><select class="pkgaction"><option value="keep">Keep</option><option value="remove">Remove</option></select></td><td>vim</td><td class="planned-change">No change</td></tr>
</tbody></table>
<pre id="result"></pre>
<script>
(function () {
    const colors = {
        remove: 'rgba(198, 40, 40, 0.22)',
        install: 'rgba(46, 125, 50, 0.22)',
        upgrade: 'rgba(21, 101, 192, 0.22)',
        available: 'rgba(249, 168, 37, 0.22)'
    };
    const row = name => document.querySelector(`tr[data-case="${name}"]`);
    const select = name => row(name).querySelector('select');
    const background = name => getComputedStyle(row(name)).backgroundColor;
    const weight = (name, index) => getComputedStyle(row(name).querySelectorAll('.version-value')[index]).fontWeight;
    const assert = (condition, message) => { if (!condition) throw new Error(message); };
    try {
        assert(CSS.supports('selector(tr:has(select))'), ':has() selector support is required');
        assert(background('current') !== colors.remove, 'Keep row must not be red');
        assert(background('available') === colors.available, 'Available update must be yellow');
        assert(weight('available', 0) === '600' && weight('available', 1) === '600', 'Available versions must be bold');
        assert(background('install') === colors.install, 'Install must be green');
        select('available').value = 'upgrade';
        assert(background('available') === colors.upgrade, 'Upgrade must override yellow with blue');
        for (const name of ['libyaml', 'ruby', 'vim']) select(name).value = 'remove';
        for (const name of ['libyaml', 'ruby', 'vim']) assert(background(name) === colors.remove, `${name} Remove must be red`);
        select('ruby').value = 'keep';
        assert(background('ruby') !== colors.remove, 'Ruby Keep must immediately clear red');
        assert(background('libyaml') === colors.remove && background('vim') === colors.remove, 'Other Remove rows must stay red');
        document.title = 'PASS'; document.getElementById('result').textContent = 'PASS';
    } catch (error) {
        document.title = 'FAIL'; document.getElementById('result').textContent = error.stack || String(error);
    }
}());
</script>
</body>
</html>
