    needs: [package-list]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.package-list.outputs.names, '"alsa-lib"') }}
    uses: ./.github/workflows/package-build.yml
