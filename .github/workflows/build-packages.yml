name: Build native packages
run-name: Unraid compatibility ${{ inputs.unraid_version }} ${{ inputs.unraid_sha256 }}

on:
  pull_request:
    paths:
      - build/**
      - .github/workflows/build-packages.yml
  push:
    branches: [master, main]
    paths:
      - build/**
      - .github/workflows/build-packages.yml
  workflow_dispatch:
    inputs:
      unraid_version:
        description: Exact official target version (source builds always use the pinned 7.3.4 baseline)
        required: true
        type: string
        default: '7.3.4'
      unraid_sha256:
        description: SHA256 of the exact official target ZIP
        required: true
        type: string
        default: ba608638e743b323f4581e911fd07093158344010dab14bb19607b46999530e9
      unraid_url:
        description: HTTPS image URL under releases.unraid.net/dl/
        required: true
        type: string
        default: https://releases.unraid.net/dl/stable/7.3.4/ae8169459e2277e8d450b9a590c18f747dd8eaa50ebc54743a36cadd093cbfb8/unRAIDServer-7.3.4-x86_64.zip
      channel:
        description: Official release channel
        required: true
        type: choice
        options: [stable, next]
        default: stable
      publish:
        description: Publish after all gates pass (stable 7.3 targets only; monitoring always uses false)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}-${{ inputs.unraid_version }}-${{ inputs.unraid_sha256 }}-${{ inputs.publish }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install SquashFS test tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes squashfs-tools
      - name: Test the trust boundaries and catalog contract
        run: python3 -m unittest discover -s build -p 'test_*.py'
      - name: Validate checked recipes, pins, dependency closure, and complete catalog
        run: python3 build/native.py validate

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read the canonical baseline pins
        id: baseline
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open('build/baseline.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'version':data['version'], 'url':data['image']['url'], 'sha256':data['image']['sha256'], 'bzroot':data['bzroot_sha256']}.items():
                  output.write(f'{key}={value}\n')
          PY
      - name: Prepare the private exact-version baseline and development roots
        id: roots
        uses: ./build/unraid-build-root
        with:
          version: ${{ steps.baseline.outputs.version }}
          url: ${{ steps.baseline.outputs.url }}
          sha256: ${{ steps.baseline.outputs.sha256 }}
          bzroot-sha256: ${{ steps.baseline.outputs.bzroot }}
          toolchain-lock: build/locks/toolchain.json
      - name: Install VM tools and configure subordinate sandbox identities
        run: |
          sudo apt-get install --no-install-recommends --yes binutils qemu-system-x86 bubblewrap uidmap
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 root
      - name: Require the mapped sandbox to exclude host paths and privileged mounts
        env:
          DEVELOPMENT_ROOT: ${{ steps.roots.outputs.development-root }}
        run: sudo python3 build/native.py sandbox-check --development-root "$DEVELOPMENT_ROOT" --work /tmp
      - name: Build from locked inputs, audit target ABI, and boot the exact target kernel
        env:
          TARGET_VERSION: ${{ inputs.unraid_version }}
          TARGET_SHA256: ${{ inputs.unraid_sha256 }}
          TARGET_URL: ${{ inputs.unraid_url }}
          TARGET_CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
          BASELINE_ROOT: ${{ steps.roots.outputs.baseline-root }}
          DEVELOPMENT_ROOT: ${{ steps.roots.outputs.development-root }}
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
          sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_SHA,RUNNER_TEMP python3 build/native.py build \
            --work /tmp \
            --baseline-root "$BASELINE_ROOT" --development-root "$DEVELOPMENT_ROOT" \
            --unraid-version "$TARGET_VERSION" --unraid-sha256 "$TARGET_SHA256" \
            --unraid-url "$TARGET_URL" --channel "$TARGET_CHANNEL" "${args[@]}"
      - name: Upload packages and corresponding sources only after publication gates
        if: inputs.publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload only compatibility evidence for read-only runs
        if: '!inputs.publish'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/compatibility-7.3.json
            dist/provenance-7.3.json
            dist/kernel-smoke-7.3.log
          if-no-files-found: error
          retention-days: 90
      # Neither the proprietary Unraid ZIP nor any extracted rootfs is uploaded or cached.

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.channel == 'stable'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Require successful kernel, ABI and smoke acceptance evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('dist')
          report = json.loads((root / 'compatibility-7.3.json').read_text())
          catalog = json.loads((root / 'catalog-7.3.json').read_text())
          assert report['status'] == 'passed' and report['publish_requested'] is True
          assert report['channel'] == 'stable' and report['target_version'].startswith('7.3.')
          assert report['target_kernel'] and report['elf_files_checked'] > 0
          assert report['packages_checked'] == len(catalog['packages']) >= 73
          assert report['provided_tools_checked'] == len(catalog['provided_packages'])
          assert report['native_tools_checked'] + report['provided_tools_checked'] == 74
          PY
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish immutable assets without changing the plugin's latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: packages-7.3-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_SHA" --latest=false \
            --title "Native NerdTools 7.3 — $RELEASE_TAG" \
            --notes 'Built from checked public recipes and SHA256-pinned inputs against Unraid 7.3.4. Corresponding source inputs and exact adapted scripts are retained in sources-7.3.tar.xz; see provenance, SHA256SUMS and the target-kernel acceptance report. RAR is external, never redistributed. Older releases and assets are retained.'
