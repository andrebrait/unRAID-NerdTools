name: Build native packages
run-name: Unraid compatibility ${{ inputs.unraid_version }} ${{ inputs.unraid_sha256 }}

on:
  pull_request:
    paths:
      - build/**
      - .github/workflows/build-packages.yml
  push:
    branches: [master, main]
    paths:
      - build/**
      - .github/workflows/build-packages.yml
  workflow_dispatch:
    inputs:
      unraid_version:
        description: Exact official target version (source builds always use the pinned 7.3.4 baseline)
        required: true
        type: string
        default: '7.3.4'
      unraid_sha256:
        description: SHA256 of the exact official target ZIP
        required: true
        type: string
        default: ba608638e743b323f4581e911fd07093158344010dab14bb19607b46999530e9
      unraid_url:
        description: HTTPS image URL under releases.unraid.net/dl/
        required: true
        type: string
        default: https://releases.unraid.net/dl/stable/7.3.4/ae8169459e2277e8d450b9a590c18f747dd8eaa50ebc54743a36cadd093cbfb8/unRAIDServer-7.3.4-x86_64.zip
      channel:
        description: Official release channel
        required: true
        type: choice
        options: [stable, next]
        default: stable
      publish:
        description: Publish after all gates pass (stable 7.3 targets only; monitoring always uses false)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}-${{ inputs.unraid_version }}-${{ inputs.unraid_sha256 }}-${{ inputs.publish }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    # Debian builder image with all tools (build/runner/Dockerfile), pinned by digest. Privileged for
    # Bubblewrap user namespaces, mknod and /dev/kvm. Update the digest after builder-image.yml republishes it.
    container:
      image: ghcr.io/andrebrait/unraid-nerdtools-builder@sha256:20d97a9fcf230d08cc68ff1ef9aeff1ded90dca60102d2ffdda6df72be5aff25
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restrict publication to the default branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: echo "Publication requires the default branch" >&2; exit 1
      - name: Test the trust boundaries and catalog contract
        run: python3 -m unittest discover -s build -p 'test_*.py'
      - name: Validate checked recipes, pins, dependency closure, and complete catalog
        run: python3 build/native.py validate

  package-list:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.packages.outputs.names }}
      plan: ${{ steps.packages.outputs.plan }}
      tag: ${{ steps.packages.outputs.tag }}
      builds: ${{ steps.packages.outputs.builds }}
      reuse: ${{ steps.packages.outputs.reuse }}
      wave-1: ${{ steps.packages.outputs.wave-1 }}
      wave-2: ${{ steps.packages.outputs.wave-2 }}
      wave-3: ${{ steps.packages.outputs.wave-3 }}
      wave-4: ${{ steps.packages.outputs.wave-4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compile only packages whose build identity differs from the newest published release
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir previous
          tag=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name == "build-keys.json"))][0].tag_name // empty')
          if [[ -n "$tag" ]]; then
            gh release download "$tag" --dir previous --pattern build-keys.json --pattern 'catalog-*.json' --pattern 'provenance-*.json'
            # Identities of the previous release recomputed with this code, so changing how keys are
            # computed never rebuilds packages whose own inputs did not change.
            commit=$(jq -r .commit previous/provenance-*.json)
            git worktree add --detach "$RUNNER_TEMP/previous-tree" "$commit"
            NERDTOOLS_REPO="$RUNNER_TEMP/previous-tree" python3 build/native.py keys > previous/build-keys.json
          fi
          plan=$(python3 build/native.py plan --previous previous)
          jq -r '"Compiling \(.build | length), carrying over \(.reuse | length)"' <<<"$plan"
          { echo "tag=$tag"; echo "plan=$plan"; echo "names=$(jq -c .build <<<"$plan")"; echo "builds=$(jq -c .builds <<<"$plan")"; echo "reuse=$(jq -c .reuse <<<"$plan")"; for k in 1 2 3 4; do echo "wave-$k=$(jq -c ".waves[$((k-1))]" <<<"$plan")"; done; } >> "$GITHUB_OUTPUT"

  # Wave 1: changed packages whose changed dependencies were built in earlier waves of this run.
  package-1:
    needs: package-list
    if: needs.package-list.outputs.wave-1 != '[]'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        package: ${{ fromJSON(needs.package-list.outputs.wave-1) }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: ${{ matrix.package }}
      retain-artifact: true
      same-run-dependencies: false
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  # Wave 2: changed packages whose changed dependencies were built in earlier waves of this run.
  package-2:
    needs: [package-list, package-1]
    if: always() && needs.package-list.result == 'success' && (needs.package-1.result == 'success' || needs.package-1.result == 'skipped') && needs.package-list.outputs.wave-2 != '[]'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        package: ${{ fromJSON(needs.package-list.outputs.wave-2) }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: ${{ matrix.package }}
      retain-artifact: true
      same-run-dependencies: true
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  # Wave 3: changed packages whose changed dependencies were built in earlier waves of this run.
  package-3:
    needs: [package-list, package-2]
    if: always() && needs.package-list.result == 'success' && (needs.package-2.result == 'success' || needs.package-2.result == 'skipped') && needs.package-list.outputs.wave-3 != '[]'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        package: ${{ fromJSON(needs.package-list.outputs.wave-3) }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: ${{ matrix.package }}
      retain-artifact: true
      same-run-dependencies: true
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  # Wave 4: changed packages whose changed dependencies were built in earlier waves of this run.
  package-4:
    needs: [package-list, package-3]
    if: always() && needs.package-list.result == 'success' && (needs.package-3.result == 'success' || needs.package-3.result == 'skipped') && needs.package-list.outputs.wave-4 != '[]'
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        package: ${{ fromJSON(needs.package-list.outputs.wave-4) }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: ${{ matrix.package }}
      retain-artifact: true
      same-run-dependencies: true
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  build:
    if: always() && github.event_name == 'workflow_dispatch' && needs.package-list.result == 'success' && (needs.package-1.result == 'success' || needs.package-1.result == 'skipped') && (needs.package-2.result == 'success' || needs.package-2.result == 'skipped') && (needs.package-3.result == 'success' || needs.package-3.result == 'skipped') && (needs.package-4.result == 'success' || needs.package-4.result == 'skipped')
    needs: [package-list, package-1, package-2, package-3, package-4]
    runs-on: ubuntu-24.04
    # Debian builder image with all tools (build/runner/Dockerfile), pinned by digest. Privileged for
    # Bubblewrap user namespaces, mknod and /dev/kvm. Update the digest after builder-image.yml republishes it.
    container:
      image: ghcr.io/andrebrait/unraid-nerdtools-builder@sha256:20d97a9fcf230d08cc68ff1ef9aeff1ded90dca60102d2ffdda6df72be5aff25
      options: --privileged
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download only packages built in this workflow run
        if: needs.package-list.outputs.names != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-package-*
          merge-multiple: true
          path: package-artifacts
      - name: Carry over unchanged packages from the previous release, verifying each checksum
        env:
          REPOSITORY: ${{ github.repository }}
          PLAN: ${{ needs.package-list.outputs.plan }}
          TAG: ${{ needs.package-list.outputs.tag }}
        run: |
          mkdir -p package-artifacts
          python3 - <<'PY'
          import hashlib, json, os, shutil, urllib.request
          # Public release assets; the builder image has no gh CLI and needs no token for these.
          base = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{os.environ['TAG']}/"
          for item in json.loads(os.environ['PLAN'])['reuse']:
              path = 'package-artifacts/' + item['file']
              with urllib.request.urlopen(base + item['file'], timeout=300) as response, open(path, 'wb') as stream:
                  shutil.copyfileobj(response, stream)
              with open(path, 'rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == item['sha256'], item['file']
          PY
      - name: Read the canonical baseline pins
        id: baseline
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open('build/baseline.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'version':data['version'], 'url':data['image']['url'], 'sha256':data['image']['sha256'], 'bzroot':data['bzroot_sha256']}.items():
                  output.write(f'{key}={value}\n')
          PY
      - name: Prepare the private exact-version baseline and development roots
        id: roots
        uses: ./build/unraid-build-root
        with:
          version: ${{ steps.baseline.outputs.version }}
          url: ${{ steps.baseline.outputs.url }}
          sha256: ${{ steps.baseline.outputs.sha256 }}
          bzroot-sha256: ${{ steps.baseline.outputs.bzroot }}
          toolchain-lock: build/locks/toolchain.json
      - name: Require the mapped sandbox to exclude host paths and privileged mounts
        env:
          DEVELOPMENT_ROOT: ${{ steps.roots.outputs.development-root }}
        run: sudo python3 build/native.py sandbox-check --development-root "$DEVELOPMENT_ROOT" --work /tmp
      - name: Build from locked inputs, audit target ABI, and boot the exact target kernel
        env:
          TARGET_VERSION: ${{ inputs.unraid_version }}
          TARGET_SHA256: ${{ inputs.unraid_sha256 }}
          TARGET_URL: ${{ inputs.unraid_url }}
          TARGET_CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
          NERDTOOLS_BUILDS: ${{ needs.package-list.outputs.builds }}
          NERDTOOLS_PREVIOUS_RELEASE: ${{ needs.package-list.outputs.tag }}
          BASELINE_ROOT: ${{ steps.roots.outputs.baseline-root }}
          DEVELOPMENT_ROOT: ${{ steps.roots.outputs.development-root }}
        run: |
          args=(--package-artifacts "$GITHUB_WORKSPACE/package-artifacts")
          if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_SHA,RUNNER_TEMP,SOURCE_DATE_EPOCH,NERDTOOLS_BUILDS,NERDTOOLS_PREVIOUS_RELEASE python3 build/native.py build \
            --work /tmp \
            --baseline-root "$BASELINE_ROOT" --development-root "$DEVELOPMENT_ROOT" \
            --unraid-version "$TARGET_VERSION" --unraid-sha256 "$TARGET_SHA256" \
            --unraid-url "$TARGET_URL" --channel "$TARGET_CHANNEL" "${args[@]}"
      - name: Upload packages and corresponding sources only after publication gates
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload only compatibility evidence for read-only runs
        if: '!inputs.publish'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/compatibility-*.json
            dist/provenance-*.json
            dist/kernel-smoke-*.log
          if-no-files-found: error
          retention-days: 90
      # Neither the proprietary Unraid ZIP nor any extracted rootfs is uploaded or cached.

  publish:
    if: always() && needs.build.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Require successful kernel, ABI and smoke acceptance evidence
        id: evidence
        env:
          TARGET_VERSION: ${{ inputs.unraid_version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('dist')
          target = os.environ['TARGET_VERSION']
          family = '.'.join(target.split('.')[:2])
          report = json.loads((root / f'compatibility-{family}.json').read_text())
          catalog = json.loads((root / f'catalog-{family}.json').read_text())
          assert report['status'] == 'passed' and report['publish_requested'] is True
          assert report['target_version'] == target and catalog['family'] == family
          assert report['target_kernel'] and report['elf_files_checked'] > 0
          assert report['packages_checked'] == len(catalog['packages']) >= 73
          assert report['provided_tools_checked'] == len(catalog['provided_packages'])
          assert report['native_tools_checked'] + report['provided_tools_checked'] == 74
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'family={family}\n')
          PY
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish immutable assets without changing the plugin's latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: packages-${{ steps.evidence.outputs.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_VERSION: ${{ inputs.unraid_version }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_SHA" --latest=false \
            --title "Native NerdTools for Unraid $TARGET_VERSION — $RELEASE_TAG" \
            --notes "Built from checked public recipes and SHA256-pinned inputs against the Unraid 7.3.4 baseline, then installed, audited and smoke-tested on Unraid $TARGET_VERSION. Corresponding source inputs and exact adapted scripts are retained in the sources archive; see provenance, SHA256SUMS and the target-kernel acceptance report. RAR is external, never redistributed. Older releases and assets are retained."
