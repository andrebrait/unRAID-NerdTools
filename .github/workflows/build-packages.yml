      reuse-tag: ${{ needs.package-list.outputs.tag }}

  package-tcpdump:
    needs: [package-list]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.package-list.outputs.names, '"tcpdump"') }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: "tcpdump"
      retain-artifact: true
      same-run-dependencies: false
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  package-tmux:
    needs: [package-list]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.package-list.outputs.names, '"tmux"') }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: "tmux"
      retain-artifact: true
      same-run-dependencies: false
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  package-unrar:
    needs: [package-list]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.package-list.outputs.names, '"unrar"') }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: "unrar"
      retain-artifact: true
      same-run-dependencies: false
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  package-utf8proc:
    needs: [package-list]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.package-list.outputs.names, '"utf8proc"') }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: "utf8proc"
      retain-artifact: true
      same-run-dependencies: false
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  package-vim:
    needs: [package-list, package-lua, package-python3, package-ruby, package-tcl]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.package-list.outputs.names, '"vim"') }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: "vim"
      retain-artifact: true
      same-run-dependencies: ${{ contains(needs.package-list.outputs.names, '"lua"') || contains(needs.package-list.outputs.names, '"python3"') || contains(needs.package-list.outputs.names, '"ruby"') || contains(needs.package-list.outputs.names, '"tcl"') }}
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  package-wget2:
    needs: [package-list]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.package-list.outputs.names, '"wget2"') }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: "wget2"
      retain-artifact: true
      same-run-dependencies: false
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  package-zenmap-typelibs:
    needs: [package-list, package-python-setuptools, package-python3]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.package-list.outputs.names, '"zenmap-typelibs"') }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: "zenmap-typelibs"
      retain-artifact: true
      same-run-dependencies: ${{ contains(needs.package-list.outputs.names, '"python-setuptools"') || contains(needs.package-list.outputs.names, '"python3"') }}
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  package-zsh:
    needs: [package-list]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.package-list.outputs.names, '"zsh"') }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: "zsh"
      retain-artifact: true
      same-run-dependencies: false
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  # Fails when any package job failed or was cancelled; skipped jobs are carried over.
  packages:
    needs: [package-list, package-alsa-lib, package-aria2, package-audit, package-autossh, package-axel, package-bc, package-bluez, package-borgbackup, package-btop, package-bwm-ng, package-cksfv, package-ddrescue, package-exiftool, package-fdupes, package-fio, package-fish, package-fzf, package-gnupg2, package-gpgme, package-iftop, package-iotop, package-ipmitool, package-irssi, package-jdupes, package-lftp, package-libassuan, package-libical, package-libjodycode, package-libksba, package-libmediainfo, package-libnl, package-libsodium, package-libtraceevent, package-libtracefs, package-libyaml, package-libzen, package-llfuse, package-lua, package-mediainfo, package-mktorrent, package-mlocate, package-msgpack-python, package-ncdu, package-neofetch, package-netcat, package-nload, package-nmap, package-nodejs, package-npth, package-p7zip, package-par2cmdline, package-pigz, package-pinentry, package-plocate, package-powershell, package-powertop, package-pycairo, package-pygobject3, package-python-packaging, package-python-pip, package-python-setuptools, package-python2, package-python3, package-rar2fs, package-rclone, package-restic, package-rsnapshot, package-ruby, package-screen, package-socat, package-sshfs, package-sshpass, package-stress, package-stunnel, package-tcl, package-tcllib, package-tcpdump, package-tmux, package-unrar, package-utf8proc, package-vim, package-wget2, package-zenmap-typelibs, package-zsh]
    if: ${{ !cancelled() && needs.package-list.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every planned package job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS"; ! grep -qE 'failure|cancelled' <<<"$RESULTS"
  # END generated package jobs

  build:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.packages.result == 'success' }}
    needs: [package-list, packages]
    runs-on: ubuntu-24.04
    # Debian builder image with all tools (build/runner/Dockerfile), pinned by digest. Privileged for
    # Bubblewrap user namespaces, mknod and /dev/kvm. Update the digest after builder-image.yml republishes it.
    container:
      image: ghcr.io/andrebrait/unraid-nerdtools-builder@sha256:20d97a9fcf230d08cc68ff1ef9aeff1ded90dca60102d2ffdda6df72be5aff25
      options: --privileged
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download only packages built in this workflow run
        if: needs.package-list.outputs.names != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-package-*
          merge-multiple: true
          path: package-artifacts
      - name: Carry over unchanged packages from the previous release, verifying each checksum
        env:
          REPOSITORY: ${{ github.repository }}
          PLAN: ${{ needs.package-list.outputs.plan }}
          TAG: ${{ needs.package-list.outputs.tag }}
        run: |
          mkdir -p package-artifacts
          python3 - <<'PY'
          import hashlib, json, os, shutil, urllib.request
          # Public release assets; the builder image has no gh CLI and needs no token for these.
          base = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{os.environ['TAG']}/"
          for item in json.loads(os.environ['PLAN'])['reuse']:
              path = 'package-artifacts/' + item['file']
              with urllib.request.urlopen(base + item['file'], timeout=300) as response, open(path, 'wb') as stream:
                  shutil.copyfileobj(response, stream)
              with open(path, 'rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == item['sha256'], item['file']
          PY
      - name: Read the canonical baseline pins
        id: baseline
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open('build/baseline.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'version':data['version'], 'url':data['image']['url'], 'sha256':data['image']['sha256'], 'bzroot':data['bzroot_sha256']}.items():
                  output.write(f'{key}={value}\n')
          PY
      - name: Prepare the private exact-version baseline and development roots
        id: roots
        uses: ./build/unraid-build-root
        with:
          version: ${{ steps.baseline.outputs.version }}
          url: ${{ steps.baseline.outputs.url }}
          sha256: ${{ steps.baseline.outputs.sha256 }}
          bzroot-sha256: ${{ steps.baseline.outputs.bzroot }}
          toolchain-lock: build/locks/toolchain.json
      - name: Require the mapped sandbox to exclude host paths and privileged mounts
        env:
          DEVELOPMENT_ROOT: ${{ steps.roots.outputs.development-root }}
        run: sudo python3 build/native.py sandbox-check --development-root "$DEVELOPMENT_ROOT" --work /tmp
      - name: Build from locked inputs, audit target ABI, and boot the exact target kernel
        env:
          TARGET_VERSION: ${{ inputs.unraid_version }}
          TARGET_SHA256: ${{ inputs.unraid_sha256 }}
          TARGET_URL: ${{ inputs.unraid_url }}
          TARGET_CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
          NERDTOOLS_BUILDS: ${{ needs.package-list.outputs.builds }}
          NERDTOOLS_PREVIOUS_RELEASE: ${{ needs.package-list.outputs.tag }}
          BASELINE_ROOT: ${{ steps.roots.outputs.baseline-root }}
          DEVELOPMENT_ROOT: ${{ steps.roots.outputs.development-root }}
        run: |
          args=(--package-artifacts "$GITHUB_WORKSPACE/package-artifacts")
          if [[ "$PUBLISH" == true ]]; then args+=(--publish); fi
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_SHA,RUNNER_TEMP,SOURCE_DATE_EPOCH,NERDTOOLS_BUILDS,NERDTOOLS_PREVIOUS_RELEASE python3 build/native.py build \
            --work /tmp \
            --baseline-root "$BASELINE_ROOT" --development-root "$DEVELOPMENT_ROOT" \
            --unraid-version "$TARGET_VERSION" --unraid-sha256 "$TARGET_SHA256" \
            --unraid-url "$TARGET_URL" --channel "$TARGET_CHANNEL" "${args[@]}"
      - name: Upload packages and corresponding sources only after publication gates
        if: inputs.publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
      - name: Upload only compatibility evidence for read-only runs
        if: '!inputs.publish'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/compatibility-*.json
            dist/provenance-*.json
            dist/kernel-smoke-*.log
          if-no-files-found: error
          retention-days: 90
      # Neither the proprietary Unraid ZIP nor any extracted rootfs is uploaded or cached.

  publish:
    if: always() && needs.build.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Require successful kernel, ABI and smoke acceptance evidence
        id: evidence
        env:
          TARGET_VERSION: ${{ inputs.unraid_version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('dist')
          target = os.environ['TARGET_VERSION']
          family = '.'.join(target.split('.')[:2])
          report = json.loads((root / f'compatibility-{family}.json').read_text())
          catalog = json.loads((root / f'catalog-{family}.json').read_text())
          assert report['status'] == 'passed' and report['publish_requested'] is True
          assert report['target_version'] == target and catalog['family'] == family
          assert report['target_kernel'] and report['elf_files_checked'] > 0
          assert report['packages_checked'] == len(catalog['packages']) >= 73
          assert report['provided_tools_checked'] == len(catalog['provided_packages'])
          assert report['native_tools_checked'] + report['provided_tools_checked'] == 74
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'family={family}\n')
          PY
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Authorize the exact source revision immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/upstream-updates.py authorize
      - name: Publish immutable assets without changing the plugin's latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: packages-${{ steps.evidence.outputs.family }}-${{ github.run_id }}-${{ github.run_attempt }}
          TARGET_VERSION: ${{ inputs.unraid_version }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_SHA" --latest=false \
            --title "Native NerdTools for Unraid $TARGET_VERSION — $RELEASE_TAG" \
            --notes "Built from checked public recipes and SHA256-pinned inputs against the Unraid 7.3.4 baseline, then installed, audited and smoke-tested on Unraid $TARGET_VERSION. Corresponding source inputs and exact adapted scripts are retained in the sources archive; see provenance, SHA256SUMS and the target-kernel acceptance report. RAR is external, never redistributed. Older releases and assets are retained."
