name: Build native packages
run-name: Unraid compatibility ${{ inputs.unraid_version }} ${{ inputs.unraid_sha256 }} publish=${{ inputs.publish || false }}${{ inputs.candidate_run_id && format(' candidate={0}/{1}', inputs.candidate_run_id, inputs.candidate_run_attempt) || '' }}

on:
  pull_request:
    paths:
      - build/**
      - .github/workflows/build-packages.yml
  push:
    branches: [master, main]
    paths:
      - build/**
      - .github/workflows/build-packages.yml
  workflow_dispatch:
    inputs:
      unraid_version:
        description: Exact official target version (source builds always use the pinned 7.3.4 baseline)
        required: true
        type: string
        default: '7.3.4'
      unraid_sha256:
        description: SHA256 of the exact official target ZIP
        required: true
        type: string
        default: ba608638e743b323f4581e911fd07093158344010dab14bb19607b46999530e9
      unraid_url:
        description: HTTPS image URL under releases.unraid.net/dl/
        required: true
        type: string
        default: https://releases.unraid.net/dl/stable/7.3.4/ae8169459e2277e8d450b9a590c18f747dd8eaa50ebc54743a36cadd093cbfb8/unRAIDServer-7.3.4-x86_64.zip
      channel:
        description: Official release channel
        required: true
        type: choice
        options: [stable, next]
        default: stable
      publish:
        description: Publish after all gates pass (stable 7.3 targets only; monitoring always uses false)
        required: true
        type: boolean
        default: false
      candidate_pr:
        description: Candidate pull request number
        required: false
        type: string
      candidate_head_sha:
        description: Candidate pull request head SHA
        required: false
        type: string
      candidate_run_id:
        description: Candidate build workflow run ID
        required: false
        type: string
      candidate_run_attempt:
        description: Candidate build workflow run attempt
        required: false
        type: string
      candidate_package_artifact_id:
        description: Candidate package artifact ID
        required: false
        type: string
      candidate_package_artifact_name:
        description: Candidate package artifact name
        required: false
        type: string
      candidate_manifest_artifact_id:
        description: Candidate manifest artifact ID
        required: false
        type: string
      candidate_manifest_artifact_name:
        description: Candidate manifest artifact name
        required: false
        type: string
      candidate_manifest_sha256:
        description: Candidate manifest SHA256
        required: false
        type: string
      candidate_merge_sha:
        description: Merge commit SHA that authorized the candidate
        required: false
        type: string

# Container jobs default to sh (dash in the Debian image); steps are written for bash.
defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}-${{ inputs.unraid_version }}-${{ inputs.unraid_sha256 }}-${{ inputs.publish }}${{ inputs.candidate_run_id && format('-candidate-{0}-{1}', inputs.candidate_run_id, inputs.candidate_run_attempt) || '' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    # Debian builder image with all tools (build/runner/Dockerfile), pinned by digest. Privileged for
    # Bubblewrap user namespaces, mknod and /dev/kvm. Update the digest after builder-image.yml republishes it.
    container:
      image: ghcr.io/andrebrait/unraid-nerdtools-builder@sha256:20d97a9fcf230d08cc68ff1ef9aeff1ded90dca60102d2ffdda6df72be5aff25
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restrict publication to the default branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: echo "Publication requires the default branch" >&2; exit 1
      - name: Test the trust boundaries and catalog contract
        run: python3 -m unittest discover -s build -p 'test_*.py'
      - name: Validate checked recipes, pins, dependency closure, and complete catalog
        run: python3 build/native.py validate

  package-list:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.packages.outputs.names }}
      plan: ${{ steps.packages.outputs.plan }}
      tag: ${{ steps.packages.outputs.tag }}
      builds: ${{ steps.packages.outputs.builds }}
      reuse: ${{ steps.packages.outputs.reuse }}
      candidate_mode: ${{ steps.packages.outputs.candidate_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compile only packages whose build identity differs from the newest published release
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_HEAD_SHA: ${{ inputs.candidate_head_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_PACKAGE_ARTIFACT_ID: ${{ inputs.candidate_package_artifact_id }}
          CANDIDATE_PACKAGE_ARTIFACT_NAME: ${{ inputs.candidate_package_artifact_name }}
          CANDIDATE_MANIFEST_ARTIFACT_ID: ${{ inputs.candidate_manifest_artifact_id }}
          CANDIDATE_MANIFEST_ARTIFACT_NAME: ${{ inputs.candidate_manifest_artifact_name }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          CANDIDATE_MERGE_SHA: ${{ inputs.candidate_merge_sha }}
        run: |
          mkdir previous
          tag=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name == "build-keys.json"))][0].tag_name // empty')
          if [[ -n "$tag" ]]; then
            gh release download "$tag" --dir previous --pattern build-keys.json --pattern 'catalog-*.json' --pattern 'provenance-*.json'
            # Identities of the previous release recomputed with this code, so changing how keys are
            # computed never rebuilds packages whose own inputs did not change.
            commit=$(jq -r .commit previous/provenance-*.json)
            git worktree add --detach "$RUNNER_TEMP/previous-tree" "$commit"
            NERDTOOLS_REPO="$RUNNER_TEMP/previous-tree" python3 build/native.py keys > previous/build-keys.json
          fi
          plan=$(python3 build/native.py plan --previous previous)
          jq -r '"Compiling \(.build | length), carrying over \(.reuse | length)"' <<<"$plan"
          candidate_mode=false
          for value in "$CANDIDATE_PR" "$CANDIDATE_HEAD_SHA" "$CANDIDATE_RUN_ID" "$CANDIDATE_RUN_ATTEMPT" \
                       "$CANDIDATE_PACKAGE_ARTIFACT_ID" "$CANDIDATE_PACKAGE_ARTIFACT_NAME" \
                       "$CANDIDATE_MANIFEST_ARTIFACT_ID" "$CANDIDATE_MANIFEST_ARTIFACT_NAME" \
                       "$CANDIDATE_MANIFEST_SHA256" "$CANDIDATE_MERGE_SHA"; do
            [[ -z "$value" ]] || candidate_mode=true
          done
          if [[ "$candidate_mode" == true ]]; then
            names='[]'
            echo "names=[]" >> "$GITHUB_OUTPUT"
          else
            names=$(jq -c .build <<<"$plan")
            echo "names=$names" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tag=$tag"
            echo "plan=$plan"
            echo "builds=$(jq -c .builds <<<"$plan")"
            echo "reuse=$(jq -c .reuse <<<"$plan")"
            echo "candidate_mode=$candidate_mode"
          } >> "$GITHUB_OUTPUT"

  candidate:
    if: github.event_name == 'workflow_dispatch'
    needs: [package-list]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      active: ${{ steps.candidate.outputs.active }}
      builds: ${{ steps.candidate.outputs.builds }}
      candidate_identity: ${{ steps.candidate.outputs.candidate_identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate exact candidate run and artifact identities
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_MODE: ${{ needs.package-list.outputs.candidate_mode }}
          BUILDS: ${{ needs.package-list.outputs.builds }}
          PLAN: ${{ needs.package-list.outputs.plan }}
          CANDIDATE_PR: ${{ inputs.candidate_pr }}
          CANDIDATE_HEAD_SHA: ${{ inputs.candidate_head_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_PACKAGE_ARTIFACT_ID: ${{ inputs.candidate_package_artifact_id }}
          CANDIDATE_PACKAGE_ARTIFACT_NAME: ${{ inputs.candidate_package_artifact_name }}
          CANDIDATE_MANIFEST_ARTIFACT_ID: ${{ inputs.candidate_manifest_artifact_id }}
          CANDIDATE_MANIFEST_ARTIFACT_NAME: ${{ inputs.candidate_manifest_artifact_name }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          CANDIDATE_MERGE_SHA: ${{ inputs.candidate_merge_sha }}
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_MODE" != true ]]; then
            {
              echo "active=false"
              echo "builds=$BUILDS"
              echo "candidate_identity={}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$CANDIDATE_PR" =~ ^[1-9][0-9]*$ \
             && "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ \
             && "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ \
             && "$CANDIDATE_PACKAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ \
             && "$CANDIDATE_MANIFEST_ARTIFACT_ID" =~ ^[1-9][0-9]*$ \
             && "$CANDIDATE_HEAD_SHA" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ \
             && "$CANDIDATE_MERGE_SHA" =~ ^([a-f0-9]{40}|[a-f0-9]{64})$ \
             && "$CANDIDATE_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$CANDIDATE_PACKAGE_ARTIFACT_NAME" == "candidate-packages-$CANDIDATE_RUN_ID-$CANDIDATE_RUN_ATTEMPT" ]]
          [[ "$CANDIDATE_MANIFEST_ARTIFACT_NAME" == "candidate-manifest-$CANDIDATE_RUN_ID-$CANDIDATE_RUN_ATTEMPT" ]]
          source_run=$(gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN_ID/attempts/$CANDIDATE_RUN_ATTEMPT")
          jq -e --argjson run "$CANDIDATE_RUN_ID" --argjson attempt "$CANDIDATE_RUN_ATTEMPT" \
             --arg head "$CANDIDATE_HEAD_SHA" \
             '.id == $run and .run_attempt == $attempt and .head_sha == $head
              and .head_branch == "automation/upstream-recipes"
              and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success"' \
             <<<"$source_run" >/dev/null
          workflow_id=$(jq -r .workflow_id <<<"$source_run")
          [[ "$(gh api "repos/$GH_REPO/actions/workflows/$workflow_id" --jq .path)" == ".github/workflows/build-packages.yml" ]]
          pull=$(gh api "repos/$GH_REPO/pulls/$CANDIDATE_PR")
          jq -e --argjson pr "$CANDIDATE_PR" --arg head "$CANDIDATE_HEAD_SHA" \
             --arg merge "$CANDIDATE_MERGE_SHA" --arg repo "$GH_REPO" \
             '.number == $pr and .state == "closed" and .merged == true and .merge_commit_sha == $merge
              and .head.sha == $head and .head.repo.full_name == $repo' <<<"$pull" >/dev/null
          tree=$(gh api "repos/$GH_REPO/commits/$CANDIDATE_HEAD_SHA" --jq .commit.tree.sha)
          check_artifact() {
            local id=$1 name=$2 metadata
            metadata=$(gh api "repos/$GH_REPO/actions/artifacts/$id")
            jq -e --argjson id "$id" --arg name "$name" --argjson run "$CANDIDATE_RUN_ID" \
               --arg head "$CANDIDATE_HEAD_SHA" \
               '.id == $id and .name == $name and .expired == false
                and .workflow_run.id == $run and .workflow_run.head_sha == $head
                and .workflow_run.head_branch == "automation/upstream-recipes"' \
               <<<"$metadata" >/dev/null
          }
          check_artifact "$CANDIDATE_PACKAGE_ARTIFACT_ID" "$CANDIDATE_PACKAGE_ARTIFACT_NAME"
          check_artifact "$CANDIDATE_MANIFEST_ARTIFACT_ID" "$CANDIDATE_MANIFEST_ARTIFACT_NAME"
          identity=$(jq -cn --arg repository "$GH_REPO" --argjson pr "$CANDIDATE_PR" \
            --arg head "$CANDIDATE_HEAD_SHA" --arg tree "$tree" --arg workflow "build-packages.yml" \
            --argjson run "$CANDIDATE_RUN_ID" --argjson attempt "$CANDIDATE_RUN_ATTEMPT" \
            --arg artifact "$CANDIDATE_PACKAGE_ARTIFACT_NAME" \
            '{repository:$repository,pr:$pr,head:$head,tree:$tree,workflow:$workflow,run:$run,attempt:$attempt,artifact_name:$artifact}')
          jq -n --argjson identity "$identity" --argjson plan "$PLAN" \
            '{identity:$identity,plan:$plan}' > "$RUNNER_TEMP/candidate-expected.json"
          {
            echo "active=true"
            echo "builds=$BUILDS"
            echo "candidate_identity=$identity"
          } >> "$GITHUB_OUTPUT"
      - name: Download the exact source-run candidate package artifact
        if: steps.candidate.outputs.active == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.candidate_package_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          path: candidate-input/packages
      - name: Download the exact source-run candidate manifest artifact
        if: steps.candidate.outputs.active == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.candidate_manifest_artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          path: candidate-input/manifest
      - name: Verify candidate manifest and package bytes before reupload
        if: steps.candidate.outputs.active == 'true'
        env:
          EXPECTED_SHA256: ${{ inputs.candidate_manifest_sha256 }}
        run: |
          set -euo pipefail
          manifest=candidate-input/manifest/candidate-manifest.json
          [[ "$(sha256sum "$manifest" | cut -d' ' -f1)" == "$EXPECTED_SHA256" ]]
          python3 build/native.py candidate-verify \
            --package-artifacts candidate-input/packages \
            --manifest "$manifest" --expected-json "$RUNNER_TEMP/candidate-expected.json"
          mkdir -p verified-candidate/packages
          cp -- candidate-input/packages/*.txz verified-candidate/packages/
          cp -- "$manifest" verified-candidate/candidate-manifest.json
      - name: Reupload one same-run verified candidate package artifact
        if: steps.candidate.outputs.active == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-candidate/
          if-no-files-found: error
          retention-days: 90

  # BEGIN generated package jobs (scripts/package-change-workflows.py); do not edit.
  package-alsa-lib:
    needs: [package-list]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && contains(needs.package-list.outputs.names, '"alsa-lib"') }}
    uses: ./.github/workflows/package-build.yml
    with:
      package: "alsa-lib"
      retain-artifact: true
      same-run-dependencies: false
      builds: ${{ needs.package-list.outputs.builds }}
      reuse: ${{ needs.package-list.outputs.reuse }}
      reuse-tag: ${{ needs.package-list.outputs.tag }}

  package-aria2:
