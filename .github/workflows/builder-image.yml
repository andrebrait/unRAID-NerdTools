name: Publish builder image

on:
  push:
    branches: [master, main]
    paths: [build/runner/**, .github/workflows/builder-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/runner
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/unraid-nerdtools-builder:latest
            ghcr.io/${{ github.repository_owner }}/unraid-nerdtools-builder:${{ github.sha }}
      # Build jobs pin the image by digest; update them to this digest after a rebuild.
      - run: echo "Pin build jobs to ghcr.io/${{ github.repository_owner }}/unraid-nerdtools-builder@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
