name: Verify catalog gate on task branch

# Temporary: reruns only the aggregate install, ABI audit and kernel smoke test
# against packages already built by an earlier catalog run.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Catalog run whose package artifacts are reused
        required: true
        type: string
  push:
    branches: [implement-maintenance]

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-package-*
          merge-multiple: true
          path: package-artifacts
          run-id: ${{ inputs.run_id || '42955158090' }}
          github-token: ${{ github.token }}
      - name: Read the canonical baseline pins
        id: baseline
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open('build/baseline.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'version':data['version'], 'url':data['image']['url'], 'sha256':data['image']['sha256'], 'bzroot':data['bzroot_sha256']}.items():
                  output.write(f'{key}={value}\n')
          PY
      - id: roots
        uses: ./build/unraid-build-root
        with:
          version: ${{ steps.baseline.outputs.version }}
          url: ${{ steps.baseline.outputs.url }}
          sha256: ${{ steps.baseline.outputs.sha256 }}
          bzroot-sha256: ${{ steps.baseline.outputs.bzroot }}
          toolchain-lock: build/locks/toolchain.json
      - run: |
          sudo apt-get install --no-install-recommends --yes binutils qemu-system-x86 bubblewrap uidmap
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 root
      - name: Install, audit target ABI, and boot the exact target kernel
        env:
          TARGET_VERSION: ${{ steps.baseline.outputs.version }}
          TARGET_SHA256: ${{ steps.baseline.outputs.sha256 }}
          TARGET_URL: ${{ steps.baseline.outputs.url }}
          BASELINE_ROOT: ${{ steps.roots.outputs.baseline-root }}
          DEVELOPMENT_ROOT: ${{ steps.roots.outputs.development-root }}
        run: |
          sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_SHA,RUNNER_TEMP python3 build/native.py build \
            --work /tmp --package-artifacts "$GITHUB_WORKSPACE/package-artifacts" \
            --baseline-root "$BASELINE_ROOT" --development-root "$DEVELOPMENT_ROOT" \
            --unraid-version "$TARGET_VERSION" --unraid-sha256 "$TARGET_SHA256" \
            --unraid-url "$TARGET_URL" --channel stable 2>&1 | grep -v -e '^+ /usr/bin/setpriv' -e '^+ unshare' -e '^	'
