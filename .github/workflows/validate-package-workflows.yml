name: Validate package workflow generation

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test semantic selection and deterministic generation without native builds
        run: python3 -m unittest discover -s tests -p 'test_package_change.py'
      - name: Require wrappers to match the current package locks
        run: python3 scripts/package-change-workflows.py --check
