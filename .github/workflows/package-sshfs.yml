name: Evaluate isolated OMP recipe update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Upstream Updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned OMP and workspace image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/omp"
          gh release download v18.20.0-int.202611150826.g7218b87 --repo ompweb-dev/oh-my-pi \
            --pattern omp-linux-x64 --dir "$RUNNER_TEMP/omp"
          echo "46e7aee0b34eb4f01f757b08fd9fd0a6170cfccdd8454816b04a9677d87c9f01  $RUNNER_TEMP/omp/omp-linux-x64" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/omp/omp-linux-x64"
          docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
      - name: Assess and port SSHFS with OpenAI first
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OMP_BINARY: ${{ runner.temp }}/omp/omp-linux-x64
          OMP_SANDBOX_IMAGE: python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          OMP_TRACE_FILE: ${{ runner.temp }}/omp-evaluation.jsonl
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, shutil, subprocess, time
          from pathlib import Path
          root = Path.cwd()
          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              return module
          agent = load('agent', root / 'scripts/upstream-agent.py')
          controller = load('controller', root / 'scripts/upstream-updates.py')
          candidates = [{'name': 'sshfs', 'ours': '3.7.6', 'upstream': '3.7.7',
                         'source': 'Slackware-current',
                         'url': 'https://slackware.uk/slackware/slackware64-current/PACKAGES.TXT'}]
          context = {'candidates': candidates, 'guide': (root / 'build/README.md').read_text(),
                     'attempt': 1, 'deadline': time.monotonic() + 1200,
                     'feedback': 'This is a genuine read-only evaluation of SSHFS 3.7.6 to 3.7.7. Assess upstream identity and licensing, download and inspect its source, port the existing recipe and locks. The controller computes recipe hashes and regenerates inventory. Do not change the inventory or workflows. Finish with your justified decision. Do not claim native build success.'}
          report = agent.run_agent(root, context)
          workspace = controller.workspace_path(root, report['workspace'])
          try:
              controller.validate_report(report, candidates)
              if report['recipes'][0]['decision'] != 'accept':
                  raise ValueError('Evaluation candidate was rejected: ' + report['recipes'][0]['reason'])
              paths = controller.validate_workspace(root, workspace, report, candidates)
              controller.import_workspace(root, workspace, paths, report)
          finally:
              shutil.rmtree(workspace)
          report.pop('workspace')
          subprocess.run(['python3', 'build/native.py', 'pin-recipes'], check=True)
          subprocess.run(['python3', 'build/native.py', 'validate'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          controller.check_paths(changed)
          output = Path('evaluation')
          output.mkdir()
          (output / 'recipe.patch').write_bytes(subprocess.check_output(['git', 'diff', '--binary']))
          (output / 'report.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Diagnose provider failure without exposing credentials or prompts
        if: failure()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          trace = Path(os.environ['RUNNER_TEMP']) / 'omp-evaluation.jsonl'
          if trace.exists():
              for line in trace.read_text().splitlines():
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  message = event.get('message', {})
                  if event.get('type') == 'message_end' and message.get('role') == 'assistant' and message.get('stopReason') == 'error':
                      error = str(message.get('errorMessage', ''))[:1500]
                      for name in ('OPENAI_API_KEY', 'ANTHROPIC_API_KEY'):
                          if os.environ.get(name):
                              error = error.replace(os.environ[name], '<REDACTED>')
                      print(re.sub(r'sk-[A-Za-z0-9_-]+', '<REDACTED>', error))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assessed-sshfs-update
          path: evaluation/
          retention-days: 1
          if-no-files-found: error
  native:
    needs: agent
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ghcr.io/andrebrait/unraid-nerdtools-builder@sha256:20d97a9fcf230d08cc68ff1ef9aeff1ded90dca60102d2ffdda6df72be5aff25
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assessed-sshfs-update
          path: evaluation
      - name: Apply the controller-validated recipe update
        run: |
          git apply --check evaluation/recipe.patch
          git apply evaluation/recipe.patch
          python3 build/native.py validate
      - name: Read exact baseline pins
        id: baseline
        run: |
          python3 - <<'PY'
          import json, os
          data = json.load(open('build/baseline.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'version':data['version'], 'url':data['image']['url'], 'sha256':data['image']['sha256'], 'bzroot':data['bzroot_sha256']}.items():
                  output.write(f'{key}={value}\n')
          PY
      - uses: ./build/unraid-build-root
        id: roots
        with:
          version: ${{ steps.baseline.outputs.version }}
          url: ${{ steps.baseline.outputs.url }}
          sha256: ${{ steps.baseline.outputs.sha256 }}
          bzroot-sha256: ${{ steps.baseline.outputs.bzroot }}
          toolchain-lock: build/locks/toolchain.json
      - name: Prove sandbox isolation, build SSHFS, and run native acceptance
        env:
          BASELINE_ROOT: ${{ steps.roots.outputs.baseline-root }}
          DEVELOPMENT_ROOT: ${{ steps.roots.outputs.development-root }}
        run: |
          sudo python3 build/native.py sandbox-check --development-root "$DEVELOPMENT_ROOT" --work /tmp
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_SHA,RUNNER_TEMP,SOURCE_DATE_EPOCH \
            python3 build/native.py build-one --package sshfs --work /tmp \
            --baseline-root "$BASELINE_ROOT" --development-root "$DEVELOPMENT_ROOT"
