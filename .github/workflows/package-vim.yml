name: Probe token workflow-file updates
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Try a workflow-only push on this disposable branch
        run: |
          printf '\n# Token capability probe\n' >> .github/workflows/package-vim.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -am 'Probe GITHUB_TOKEN workflow write'
          git push origin HEAD:refs/heads/probe/upstream-token-write
