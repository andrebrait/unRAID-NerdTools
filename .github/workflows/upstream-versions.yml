name: Update upstream recipes

on:
  schedule:
    - cron: '43 6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Build native packages']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: upstream-versions
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.head_branch == 'automation/upstream-recipes' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: Upstream Updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Test upstream automation
        run: python3 -m unittest discover -s tests -p 'test_upstream*.py'
      - name: Update the automation branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          UPSTREAM_REVIEW_BOTS: ${{ vars.UPSTREAM_REVIEW_BOTS }}
        run: python3 scripts/upstream-updates.py update
