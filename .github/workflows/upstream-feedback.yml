name: Relay upstream review feedback

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  actions: write
  pull-requests: read
  contents: read

jobs:
  relay:
    if: >-
      github.event.sender.login != 'github-actions[bot]' &&
      (github.event.sender.type == 'Bot' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association)) &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Trusted default-branch code only; the pull request branch is never checked out and no secrets are used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Relay review feedback to the automation pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/upstream-updates.py feedback
