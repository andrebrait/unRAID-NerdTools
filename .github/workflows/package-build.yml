name: Reusable native package build

on:
  workflow_call:
    inputs:
      package:
        description: Locked source package to build with its transitive dependencies
        required: true
        type: string
      retain-artifact:
        description: Retain the normalized package for the same-run catalog gate
        required: false
        default: false
        type: boolean
      builds:
        description: JSON map of package name to Slackware BUILD number chosen by the catalog plan
        required: false
        default: '{}'
        type: string
      reuse:
        description: JSON list of unchanged packages (name, file, sha256) to take from the previous release
        required: false
        default: '[]'
        type: string
      reuse-tag:
        description: Release holding the reusable packages
        required: false
        default: ''
        type: string
      same-run-dependencies:
        description: Take changed dependencies from packages built earlier in this workflow run
        required: false
        default: false
        type: boolean

# Container jobs default to sh (dash in the Debian image); steps are written for bash.
defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      selected: ${{ steps.changes.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select this package from the complete semantic commit diff
        id: changes
        env:
          PACKAGE: ${{ inputs.package }}
        run: python3 scripts/package-change.py --package "$PACKAGE"

  build:
    needs: select
    if: needs.select.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    # Debian builder image with all tools (build/runner/Dockerfile), pinned by digest. Privileged for
    # Bubblewrap user namespaces, mknod and /dev/kvm. Update the digest after builder-image.yml republishes it.
    container:
      image: ghcr.io/andrebrait/unraid-nerdtools-builder@sha256:20d97a9fcf230d08cc68ff1ef9aeff1ded90dca60102d2ffdda6df72be5aff25
      options: --privileged
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the canonical baseline pins
        id: baseline
        run: |
          python3 - <<'PY'
          import json, os
          with open('build/baseline.json') as source:
              data = json.load(source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {'version': data['version'], 'url': data['image']['url'], 'sha256': data['image']['sha256'], 'bzroot': data['bzroot_sha256']}.items():
                  output.write(f'{key}={value}\n')
          PY
      - name: Prepare private baseline and development roots
        id: roots
        uses: ./build/unraid-build-root
        with:
          version: ${{ steps.baseline.outputs.version }}
          url: ${{ steps.baseline.outputs.url }}
          sha256: ${{ steps.baseline.outputs.sha256 }}
          bzroot-sha256: ${{ steps.baseline.outputs.bzroot }}
          toolchain-lock: build/locks/toolchain.json
      - name: Require the mapped sandbox to exclude host paths and privileged mounts
        env:
          DEVELOPMENT_ROOT: ${{ steps.roots.outputs.development-root }}
        run: sudo python3 build/native.py sandbox-check --development-root "$DEVELOPMENT_ROOT" --work /tmp
      - name: Fetch unchanged dependencies from the previous release, verifying each checksum
        if: inputs.reuse-tag != ''
        env:
          PACKAGE: ${{ inputs.package }}
          REUSE: ${{ inputs.reuse }}
          TAG: ${{ inputs.reuse-tag }}
          REPOSITORY: ${{ github.repository }}
          NERDTOOLS_BUILDS: ${{ inputs.builds }}
        run: |
          mkdir -p reuse
          python3 - <<'PY'
          import hashlib, json, os, shutil, sys, urllib.request
          sys.path.insert(0, 'build')
          import native
          closure = {p['name'] for p in native.dependency_closure(native.load_packages(), os.environ['PACKAGE'])}
          base = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{os.environ['TAG']}/"
          for item in json.loads(os.environ['REUSE']):
              if item['name'] not in closure or item['name'] == os.environ['PACKAGE']:
                  continue
              path = 'reuse/' + item['file']
              with urllib.request.urlopen(base + item['file'], timeout=300) as response, open(path, 'wb') as stream:
                  shutil.copyfileobj(response, stream)
              with open(path, 'rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == item['sha256'], item['file']
          PY
      - name: Take changed dependencies from earlier waves of this run
        if: inputs.same-run-dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-package-*
          merge-multiple: true
          path: reuse
      - name: Build and validate this package and its transitive dependencies without publishing
        env:
          PACKAGE: ${{ inputs.package }}
          NERDTOOLS_BUILDS: ${{ inputs.builds }}
          BASELINE_ROOT: ${{ steps.roots.outputs.baseline-root }}
          DEVELOPMENT_ROOT: ${{ steps.roots.outputs.development-root }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          sudo --preserve-env=GITHUB_REPOSITORY,GITHUB_SHA,RUNNER_TEMP,SOURCE_DATE_EPOCH,NERDTOOLS_BUILDS python3 build/native.py build-one \
            --package "$PACKAGE" --work /tmp \
            --baseline-root "$BASELINE_ROOT" --development-root "$DEVELOPMENT_ROOT" \
            --reuse "$GITHUB_WORKSPACE/reuse"
      - name: Retain this package for the same-run catalog gate
        if: inputs.retain-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-package-${{ inputs.package }}
          path: dist/*.txz
          if-no-files-found: error
          retention-days: 1
      # Never upload or cache proprietary Unraid images or extracted roots.
